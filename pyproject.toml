[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darm"
version = "1.0.0"
description = "Safe, supervised CAN control of ODrive-driven robot arms (dARM)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.3",
    "urwid>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gamepad = ["pygame>=2.1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
darm = "darm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"darm.odrive.firmware" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = [
    "PLR2004",  # Magic numbers: protocol constants are named where they matter.
    "PLR0913",  # Too many arguments: dataclass-style constructors read fine.
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["can.*", "urwid.*", "pygame.*", "tomli"]
ignore_missing_imports = true
